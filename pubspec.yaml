name: clippingcreator
description: "AI-powered YouTube Clipping Creator — transcribe, detect viral segments, and export vertical short-form clips."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # State Management
  provider: ^6.1.2

  # HTTP & Networking
  http: ^1.3.0

  # Video
  video_player: ^2.9.3

  # File & System
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
